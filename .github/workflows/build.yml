name: Build

# Windows 二进制在这台 runner 上跑 electron-builder --win，
# macOS 打包必须在 macos runner 上跑（electron-builder 的硬限制，非 Mac 系统直接拒绝构建）。
# FFmpeg 二进制文件太大（Windows 版单文件超过 GitHub 100MB 限制），不随代码仓库提交，
# 改为每次构建时从官方发布源临时下载到 resources/ffmpeg/，构建完成后随 runner 一起丢弃。
# Windows 用静态编译的 gpl 构建（单个 exe 不依赖额外 DLL），与本地开发环境保持一致。
on:
  # 只在推送 v* 格式的 tag（如 v1.0.1）时触发打包和发版，
  # 日常 push 到 master 不再跑 CI（省 runner 时长，也不会在 Actions 页面积累大量运行记录）。
  # 手动触发（workflow_dispatch）保留，用于偶尔想验证打包是否正常时在 Actions 页面手动点。
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# release 任务需要创建 Release 并上传附件，默认的只读 GITHUB_TOKEN 权限不够，
# 这里显式开启 contents: write（仅限本 workflow 生成的临时 token，无需手动配置密钥）
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci

      - name: 下载 Windows 版 FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/ffmpeg/win
          curl -L -o ffmpeg-win.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          unzip -j ffmpeg-win.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe" -d resources/ffmpeg/win
          rm ffmpeg-win.zip
          ls -la resources/ffmpeg/win

      - name: 打包 Windows 安装包
        run: npm run build:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: video2frame-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci

      - name: 下载 macOS 版 FFmpeg
        run: |
          set -euo pipefail
          mkdir -p resources/ffmpeg/mac
          for bin in ffmpeg ffprobe; do
            curl -L -o "${bin}.zip" "https://evermeet.cx/ffmpeg/getrelease/${bin}/zip"
            unzip -o "${bin}.zip" -d resources/ffmpeg/mac
            rm "${bin}.zip"
            chmod +x "resources/ffmpeg/mac/${bin}"
          done
          ls -la resources/ffmpeg/mac

      - name: 打包 macOS 安装包
        run: npm run build:mac

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: video2frame-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  # 只在推送 v* 格式的 tag 时执行，日常 push 到 master 只打包不发布。
  # 依赖前两个 job 的产物，用 GITHUB_TOKEN（Actions 自动生成，无需手动配置密钥）创建 Release 并上传安装包。
  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: video2frame-windows
          path: artifacts/windows

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: video2frame-macos
          path: artifacts/macos

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/macos/*
          generate_release_notes: true
